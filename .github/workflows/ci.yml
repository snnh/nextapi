name: CI

# 单工作流双形态：
# - push / pull_request：跑 Rust 检查 + 前端构建 + Docker 单架构试构建（不推送）
# - release published：打 tag 的提交已在 main 上通过 CI，跳过重复检查，
#   直接构建并推送多架构镜像到 GHCR（不发布其他构建产物）
on:
  push:
  pull_request:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rust:
    # Release 发布时跳过：tag 指向的 main 提交已经过本 job 检查
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextapi
          POSTGRES_PASSWORD: nextapi
          POSTGRES_DB: nextapi
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U nextapi -d nextapi"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgres://nextapi:nextapi@127.0.0.1:5432/nextapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release

  docker:
    runs-on: ubuntu-latest
    needs: rust
    # release 事件时 rust 被跳过（result=skipped），故放行；其余事件要求 rust 成功
    if: always() && (github.event_name == 'release' || needs.rust.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 多架构（arm64）需要 QEMU，仅 release 推送时启用
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'release'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VER="${TAG#v}"
            {
              echo "tags<<EOF"
              echo "$IMAGE:$VER"
              echo "$IMAGE:latest"
              # 语义化版本追加 major.minor 浮动标签
              if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                MAJOR="${VER%%.*}"; REST="${VER#*.}"; MINOR="${REST%%.*}"
                echo "$IMAGE:$MAJOR.$MINOR"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=nextapi:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建（CI 单架构试构建 / Release 多架构推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || '' }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
