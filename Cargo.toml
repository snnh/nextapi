[package]
name = "nextapi"
version = "0.3.4"
edition = "2021"
description = "NextAPI — 自托管 LLM 网关（协议转换 / 聚合路由 / 日志统计 / 计价）"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
arc-swap = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus-client = "0.23"
crc32fast = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
argon2 = "0.5"
jsonwebtoken = "9"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
base64 = "0.22"
rand = "0.9"
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "socks"] }
bytes = "1"
futures = "0.3"
chrono-tz = "0.10"
rust-embed = "8"

[profile.release]
lto = true
codegen-units = 1

# 风格类 lint 放行（CI 保留 -D warnings 对其余 lint 严格）
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_lazy_evaluations = "allow"
items_after_test_module = "allow"
manual_clamp = "allow"
