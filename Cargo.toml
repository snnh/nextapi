[package]
name = "nextapi"
version = "0.4.0"
edition = "2021"
description = "NextAPI — 自托管 LLM 网关（协议转换 / 聚合路由 / 日志统计 / 计价）"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
arc-swap = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus-client = "0.25"
crc32fast = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
aes-gcm = "0.11"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
base64 = "0.22"
rand = "0.10"
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.7", features = ["trace", "cors"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "form", "gzip", "socks"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
bytes = "1"
futures = "0.3"
chrono-tz = "0.10"
rust-embed = "8"
libc = "0.2"
# reqwest 0.13 的 rustls-no-provider 需要显式启用一个 CryptoProvider；
# 选 ring（纯 Rust 生态、无需 cmake/aws-lc 本地编译）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
lto = true
codegen-units = 1

# 风格类 lint 放行（CI 保留 -D warnings 对其余 lint 严格）
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_lazy_evaluations = "allow"
items_after_test_module = "allow"
manual_clamp = "allow"
